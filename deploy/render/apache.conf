ServerName localhost

<VirtualHost *:10000>
    DocumentRoot /var/www/html

    Header always set Cache-Control "private, no-store"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set X-Robots-Tag "noindex, nofollow"

    Alias "/healthz" "/run/exam-scanner/health"
    <Directory "/run/exam-scanner">
        Options -Indexes
        Require all denied
        <Files "health">
            Require all granted
        </Files>
    </Directory>

    <Directory "/var/www/html">
        AllowOverride None
        Options -Indexes
        AuthType Basic
        AuthName "Exam Scanner Preview"
        AuthBasicProvider file
        AuthUserFile /run/exam-scanner/users
        Require valid-user

        RewriteEngine On
        RewriteRule ^$ exam-scanner/dist/index.html [L]
    </Directory>

    <Directory "/var/www/html/exam-scanner/backend/api">
        RewriteEngine On
        RewriteCond %{HTTP:Sec-Fetch-Site} ^cross-site$ [NC]
        RewriteCond %{REQUEST_METHOD} !^(GET|HEAD|OPTIONS)$
        RewriteRule ^ - [F,L]

        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ index.php [L]
    </Directory>
</VirtualHost>
